name: Bug report
description: Something on the page does not work as described in the README.
labels: [bug]
body:
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Firefox 131 on Windows 11, Safari on iPhone 15
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the mode, length, and category you were using.
      placeholder: |
        1. Choose Words, 25, Code Snippets (Python)
        2. Type the first line and press Enter
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: Screenshots and any errors from the browser console help.
    validations:
      required: true
